apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: orchestrator
  namespace: ai-orchestration-demo
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: orchestrator
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
    # In production this would also scale on a custom metric (e.g. pending
    # runs / queue depth from Redis) via a Prometheus adapter — CPU alone
    # under-reacts to bursty agent-run traffic.
