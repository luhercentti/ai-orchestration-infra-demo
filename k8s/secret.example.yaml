# Secrets are provisioned out-of-band in a real cluster (e.g. via External
# Secrets Operator pulling from AWS Secrets Manager). This manifest documents
# the expected shape for local/demo clusters — do not commit real values.
apiVersion: v1
kind: Secret
metadata:
  name: orchestrator-secrets
  namespace: ai-orchestration-demo
type: Opaque
stringData:
  DATABASE_URL: "postgresql://langgraph:CHANGE_ME@rds-endpoint:5432/langgraph"
  OPENAI_API_KEY: "CHANGE_ME"
